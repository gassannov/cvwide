services:
  app:
    image: cvwide:${CVWIDE_RELEASE:-local}
    build: .
    restart: unless-stopped
    init: true
    network_mode: host
    env_file: /srv/worksquad/projects/cvwide/secrets/app.env
    volumes:
      - /srv/worksquad/projects/cvwide/data:/data
      - ./runtime-assets:/app/public/assets:ro
      - /srv/worksquad/projects/cvwide/seed.json:/app/public/data/seed.json:ro
      - /home/maratik/.local/bin/codex:/usr/local/bin/codex:ro
      - /home/maratik/.codex:/home/maratik/.codex
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4312/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
