<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>CV Wide</title>
    <link rel="stylesheet" href="/login.css" />
    <script src="/login.js" defer></script>
  </head>
  <body>
    <main class="login" data-login>
      <form class="password-form" data-password-form>
        <label class="visually-hidden" for="password">Пароль</label>
        <input class="password-input" id="password" name="password" type="password" inputmode="numeric" autocomplete="current-password" maxlength="4" pattern="[0-9]{4}" required autofocus />
        <div class="password-slots" data-password-slots aria-hidden="true"><span class="password-slot" data-password-slot></span><span class="password-slot" data-password-slot></span><span class="password-slot" data-password-slot></span><span class="password-slot" data-password-slot></span></div>
        <p class="login-error" data-login-error aria-live="polite"></p>
      </form>
    </main>

  </body>
</html>
